name: Feature request
description: Suggest something portent should do.
title: "[Feature]: "
labels: ["feedback", "type:feature", "status:to-define"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening one, search [open feature requests](https://github.com/adrianfernandezalv/portent-releases/issues?q=is%3Aopen+label%3Atype%3Afeature) and add a 👍 if yours is there.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you were trying to do and where portent got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: How you picture it working. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ports & dev servers
        - Claude sessions
        - Plan usage
        - CLI (`portent`)
        - Settings
        - Other
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today?
      description: Other tools, scripts or workarounds, if any.
