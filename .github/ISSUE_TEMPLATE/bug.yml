name: Bug report
description: Something in portent doesn't work as expected.
title: "[Bug]: "
labels: ["feedback", "type:bug", "status:to-define"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. This repo is public: **never paste your license key**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a dev server with `npm run dev`
        2. Open the portent menu
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ports & dev servers
        - Claude sessions
        - Plan usage
        - CLI (`portent`)
        - Settings
        - License & purchase
        - Install & updates
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: portent version
      description: Settings → About, or `portent --version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5 (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or anything else
      description: Drag images here. Remove paths or names you don't want public.
