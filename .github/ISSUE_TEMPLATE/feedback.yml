name: Feedback
description: Report a bug or suggest a feature.
labels: ["feedback", "status:to-define"]
body:
  - type: markdown
    attributes:
      value: |
        This repo is public: **never paste your license key**.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature request
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: For bugs, include your portent version (Settings → About) and macOS version.
    validations:
      required: true
