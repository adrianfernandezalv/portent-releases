name: Feedback
description: Report a bug or suggest a feature.
labels: ["feedback", "status:to-define"]
body:
  - type: markdown
    attributes:
      value: |
        This repo is public: **never paste your license key**.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature request
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: portent version
      description: Settings → About, or `portent --version`.
      placeholder: "1.0.0"
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5 (Apple Silicon)"
