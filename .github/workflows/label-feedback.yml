name: Label feedback

# Issue forms can only set fixed labels; map the Type dropdown to type:bug / type:feature.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.labels.*.name, 'feedback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const match = (context.payload.issue.body || '').match(/### Type\s+(.+)/);
            const label = { 'Bug': 'type:bug', 'Feature request': 'type:feature' }[match?.[1].trim()];
            if (label) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels: [label] });
            }
